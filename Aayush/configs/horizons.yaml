# Horizon definitions for multi-scale path-signature novelty detection.
# window: number of bars per rolling window at that horizon's native resolution.
# step: stride between consecutive windows (overlap = window - step).
# depth: truncated signature depth used for this horizon's channel set.

asset: BTCUSDT
yahoo_ticker: BTC-USD

horizons:
  micro:
    description: "Tick-level microstructure, ~minutes"
    source: binance_ticks
    window: 1000        # trades per window
    step: 500
    depth: 3
    channels: [time, log_price, signed_volume]

  intraday:
    description: "Hourly bars, ~1 day - 1 week"
    source: binance_klines_1m   # resampled to 1h
    resample: 1h
    window: 48           # hours per window (~2 days)
    step: 24
    depth: 4
    channels: [time, log_return, volume]

  macro:
    description: "Daily bars, ~1-3 months"
    source: yahoo_daily
    window: 30           # trading days per window
    step: 10
    depth: 4
    channels: [time, log_return, volume, log_range, overnight_gap]

  macro_daily:
    # Identical to `macro` except step=1: a fresh score every day instead of
    # every 10 days. Used only for the *live/scored* series -- calibration
    # (fitting "normal", the Weibull tail, BH-FDR) stays on `macro`'s coarser,
    # much-less-overlapping step so those statistics aren't corrupted by
    # near-total window overlap (adjacent step=1 windows share 29 of 30 days).
    description: "Daily bars, scored every day (recency-weighted)"
    source: yahoo_daily
    window: 30
    step: 1
    depth: 4
    channels: [time, log_return, volume, log_range, overnight_gap]

  # --- Short horizons (5-min / 1-hour / 1-day), all derived from the same
  # underlying Binance 1-minute klines via resample_klines, so any difference
  # between them is genuinely about the horizon, not the data source. Window
  # length follows the "next-horizon-up" convention: 5-min bars in a 1-hour
  # window, 1-hour bars in a 1-day window, 1-day bars in a ~1-week window --
  # each deliberately distinct from macro (30-day) and intraday (48-hour).
  # Each has a coarse-step sibling (`_scoring`, step=1) for the live series,
  # same calibrate-coarse/score-fine split as macro/macro_daily. overnight_gap
  # is dropped for 5-min/1-hour: consecutive bars in a continuous 24/7 market
  # essentially never have a real gap at that resolution, unlike daily bars.
  # recency_halflife_bars is scaled to macro's own validated half-life/window
  # ratio (8 days / 30-day window = 0.267), expressed in EACH horizon's own
  # bar units -- apply_recency_weights counts in bars, not calendar time, so
  # reusing the raw number "8" unscaled meant 40 minutes of real decay for
  # five_min (far too sharp relative to its 1-hour window) and longer-than-
  # the-whole-window for one_day (next to no decay at all). This fixes that.
  five_min:
    # NOTE: two volume-channel fixes were tried and both made things worse
    # (log_volume: 3.3%->83.6%; log_volume_change: 3.3%->11.0%) -- raw volume
    # confirmed best. A window(12/24) x depth(2/3/4) sweep then found DEPTH,
    # not window length, is the dominant lever: depth=4 overfits noise at
    # this resolution (6mo flag rate 5.3%), depth=2 overcorrects into
    # under-triggering (0.10%), depth=3 is the sweet spot (0.66%, closest to
    # the 1% target of anything tried). Window length alone had a much
    # smaller effect than depth at any fixed depth.
    description: "5-minute bars, 1-hour window (calibration step)"
    source: binance_klines_1m
    resample: 5min
    window: 12
    step: 4
    depth: 3
    channels: [time, log_return, volume, log_range]
    recency_halflife_bars: 3   # 15 min, ratio 3/12 = 0.25

  five_min_scoring:
    description: "5-minute bars, 1-hour window, scored every bar"
    source: binance_klines_1m
    resample: 5min
    window: 12
    step: 1
    depth: 3
    channels: [time, log_return, volume, log_range]
    recency_halflife_bars: 3

  one_hour:
    description: "1-hour bars, 1-day window (calibration step)"
    source: binance_klines_1m
    resample: 1h
    window: 24
    step: 8
    depth: 4
    channels: [time, log_return, log_volume, log_range]
    recency_halflife_bars: 6   # 6 hours, ratio 6/24 = 0.25

  one_hour_scoring:
    description: "1-hour bars, 1-day window, scored every bar"
    source: binance_klines_1m
    resample: 1h
    window: 24
    step: 1
    depth: 4
    channels: [time, log_return, log_volume, log_range]
    recency_halflife_bars: 6

  one_day:
    description: "1-day bars, ~1-week window (calibration step)"
    source: binance_klines_1m
    resample: 1D
    window: 7
    step: 2
    depth: 4
    channels: [time, log_return, volume, log_range, overnight_gap]
    recency_halflife_bars: 2   # 2 days, ratio 2/7 = 0.286 (closest integer)

  one_day_scoring:
    description: "1-day bars, ~1-week window, scored every bar"
    source: binance_klines_1m
    resample: 1D
    window: 7
    step: 1
    depth: 4
    channels: [time, log_return, volume, log_range, overnight_gap]
    recency_halflife_bars: 2

# Half-life (in days) for apply_recency_weights: how quickly an increment's
# influence on a window's signature decays as it ages within the window.
# Tunable; 7-10 days was the agreed range, 8 is the midpoint default.
recency_halflife_days: 8

# Calm BTC stretches used to fit "normal" reference statistics (scalers,
# expected signature, baseline model training). Auto-detected via
# src.evaluation.regimes.find_calm_stretches (low_vol runs >= 45 days,
# >= 30 days clear of every labeled event below) rather than hand-picked --
# spans multiple market eras (2015-2026) instead of one 2023 stretch, which
# the project's own evaluation showed left every model calibrated on as few
# as 2-7 windows from a single quarter. Re-generate by re-running
# find_calm_stretches if its parameters change.
reference_periods:
  - {start: "2015-04-07", end: "2015-08-17"}
  - {start: "2015-09-07", end: "2015-11-02"}
  - {start: "2016-02-09", end: "2016-06-11"}
  - {start: "2016-07-16", end: "2017-01-04"}
  - {start: "2017-01-31", end: "2017-03-16"}
  - {start: "2018-08-13", end: "2018-11-18"}
  - {start: "2019-01-17", end: "2019-04-01"}
  - {start: "2020-06-04", end: "2020-11-25"}
  - {start: "2024-04-09", end: "2024-08-07"}
  - {start: "2024-08-28", end: "2024-11-10"}
  - {start: "2024-11-30", end: "2025-03-02"}
  - {start: "2025-04-26", end: "2026-02-04"}
  - {start: "2026-02-26", end: "2026-09-03"}

# Raw trade-by-trade data for the micro horizon is enormous (~800k-900k
# trades/day for BTCUSDT), so it uses its own much shorter reference window
# rather than the full multi-month reference_period above -- a few days is
# already tens of millions of ticks once split into 1000-trade windows.
tick_reference_period:
  start: "2023-10-01"
  end: "2023-10-05"

# Binance (source for intraday/micro) only launched in 2017, so most of the
# multi-era `reference_periods` above -- sourced from Yahoo, which goes back
# to 2014 -- aren't available for these two horizons. Intraday isn't
# multi-period-calibrated yet (it hasn't been event-validated at all so far);
# this keeps its original single reference stretch until that's tackled.
intraday_reference_period:
  start: "2023-10-01"
  end: "2023-12-15"

# The 5 pre-2017 entries in `reference_periods` above predate Binance's
# launch and can't be used for Binance-sourced horizons -- these are the
# other 8, reused as-is so "normal" is defined identically to macro wherever
# Binance actually has data, rather than each short horizon inventing its
# own reference period.
short_horizon_reference_periods:
  - {start: "2018-08-13", end: "2018-11-18"}
  - {start: "2019-01-17", end: "2019-04-01"}
  - {start: "2020-06-04", end: "2020-11-25"}
  - {start: "2024-04-09", end: "2024-08-07"}
  - {start: "2024-08-28", end: "2024-11-10"}
  - {start: "2024-11-30", end: "2025-03-02"}
  - {start: "2025-04-26", end: "2026-02-04"}
  - {start: "2026-02-26", end: "2026-09-03"}

# Continuous block used to SCORE the short horizons uniformly -- not
# restricted to the 5 labeled macro events, so genuine anomalies anywhere in
# this window (not just inside a named crisis) can be found. Also happens to
# contain 5 of the 8 calm periods above (2024-2026), pulled once as one
# continuous fetch rather than as separate islands.
short_horizon_scoring_period:
  start: "2023-09-25"
  end: "2026-09-25"

events:
  covid_crash:
    start: "2020-02-20"
    end: "2020-04-30"
  meme_stock_era_btc_runup_crash:
    start: "2021-01-01"
    end: "2021-05-31"
  crypto_crash_terra_luna:
    start: "2022-05-01"
    end: "2022-05-31"
  crypto_crash_ftx:
    start: "2022-11-01"
    end: "2022-11-30"
  banking_crisis_2023:
    start: "2023-03-01"
    end: "2023-03-31"
